<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for arinizhka</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
    }
    canvas {
        position: absolute;
        left: 0;
        top: 0;
    }
</style>
</head>
<body>

<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width, height;
let pointsOrigin = [];
let targetPoints = [];
let particles = [];
let time = 0;

const mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i
.test(navigator.userAgent.toLowerCase());

const traceCount = mobile ? 20 : 40;
const dr = mobile ? 0.3 : 0.15;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function heartPosition(rad) {
    return [
        Math.pow(Math.sin(rad), 3),
        -(
            15 * Math.cos(rad) -
            5 * Math.cos(2 * rad) -
            2 * Math.cos(3 * rad) -
            Math.cos(4 * rad)
        )
    ];
}

function scaleAndTranslate(pos, sx, sy, dx, dy) {
    return [dx + pos[0] * sx, dy + pos[1] * sy];
}

function createHeart() {
    pointsOrigin = [];
    
    // ❤️ Адаптивный уменьшенный размер
    const baseSize = Math.min(width, height) * 0.25;

    const layers = [
        [baseSize, baseSize * 0.06],
        [baseSize * 0.8, baseSize * 0.05],
        [baseSize * 0.6, baseSize * 0.04],
    ];

    for (let l = 0; l < layers.length; l++) {
        for (let i = 0; i < Math.PI * 2; i += dr) {
            pointsOrigin.push(
                scaleAndTranslate(
                    heartPosition(i),
                    layers[l][0],
                    layers[l][1],
                    0,
                    0
                )
            );
        }
    }
}

function createParticles() {
    particles = [];
    for (let i = 0; i < pointsOrigin.length; i++) {
        let x = Math.random() * width;
        let y = Math.random() * height;

        particles.push({
            vx: 0,
            vy: 0,
            speed: Math.random() + 5,
            q: Math.floor(Math.random() * pointsOrigin.length),
            D: 2 * (i % 2) - 1,
            force: 0.7 + 0.2 * Math.random(),
            trace: Array.from({ length: traceCount }, () => ({ x, y }))
        });
    }
}

function pulse(kx, ky) {
    for (let i = 0; i < pointsOrigin.length; i++) {
        targetPoints[i] = [
            kx * pointsOrigin[i][0] + width / 2,
            ky * pointsOrigin[i][1] + height / 2
        ];
    }
}

function loop() {
    let n = -Math.cos(time);
    pulse((1 + n) * 0.5, (1 + n) * 0.5);
    time += 0.02;

    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, width, height);

    for (let i = particles.length; i--;) {
        let p = particles[i];
        let q = targetPoints[p.q];

        let dx = p.trace[0].x - q[0];
        let dy = p.trace[0].y - q[1];
        let length = Math.sqrt(dx * dx + dy * dy);

        if (length < 10) {
            p.q = (p.q + p.D + pointsOrigin.length) % pointsOrigin.length;
        }

        if (length > 0) {
            p.vx += (-dx / length) * p.speed;
            p.vy += (-dy / length) * p.speed;
        }

        p.trace[0].x += p.vx;
        p.trace[0].y += p.vy;
        p.vx *= p.force;
        p.vy *= p.force;

        for (let k = 0; k < p.trace.length - 1; k++) {
            let T = p.trace[k];
            let N = p.trace[k + 1];
            N.x -= 0.4 * (N.x - T.x);
            N.y -= 0.4 * (N.y - T.y);
        }

        ctx.fillStyle = "rgba(255, 80, 120, 0.7)";
        p.trace.forEach(t => ctx.fillRect(t.x, t.y, 1, 1));
    }

    requestAnimationFrame(loop);
}

createHeart();
createParticles();
loop();
</script>

</body>
</html>
