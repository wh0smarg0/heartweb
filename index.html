<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>for arinizhka</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
    window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function (callback) { window.setTimeout(callback, 1000 / 60); };

    var canvas = document.getElementById("heart");
    var ctx = canvas.getContext("2d");
    var width, height, pointsOrigin = [], targetPoints = [], heartPointsCount;
    var e = [];
    var loaded = false;

    // Функция инициализации и адаптации под размеры экрана
    var init = function () {
        if (loaded && !arguments[0]) return; 
        loaded = true;

        // Коэффициент четкости (для мобильных экранов с высоким разрешением)
        var dpr = window.devicePixelRatio || 1;
        width = canvas.width = window.innerWidth * dpr;
        height = canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);

        var logicalWidth = window.innerWidth;
        var logicalHeight = window.innerHeight;

        // Вычисляем размер сердца относительно экрана
        // На мобилках оно будет чуть меньше, чтобы точно влезло
        var baseSize = Math.min(logicalWidth, logicalHeight) / 22;
        
        pointsOrigin = [];
        var dr = 0.1;
        
        // Слои сердца (внешний, средний, внутренний)
        for (var i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), baseSize * 13, baseSize * 0.8, 0, 0));
        for (var i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), baseSize * 10, baseSize * 0.6, 0, 0));
        for (var i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), baseSize * 7, baseSize * 0.4, 0, 0));

        heartPointsCount = pointsOrigin.length;

        // Создаем частицы, если их еще нет
        if (e.length === 0) {
            for (var i = 0; i < heartPointsCount; i++) {
                var x = Math.random() * logicalWidth;
                var y = Math.random() * logicalHeight;
                e[i] = {
                    vx: 0, vy: 0, speed: Math.random() + 5,
                    q: ~~(Math.random() * heartPointsCount),
                    D: 2 * (i % 2) - 1, force: 0.2 * Math.random() + 0.7,
                    f: "rgba(51, 204, 255, 0.7)",
                    trace: Array.from({ length: 20 }, () => ({ x: x, y: y }))
                };
            }
        }
    };

    function heartPosition(rad) {
        return [
            Math.pow(Math.sin(rad), 3),
            -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))
        ];
    }

    function scaleAndTranslate(pos, sx, sy, dx, dy) {
        return [dx + pos[0] * sx, dy + pos[1] * sy];
    }

    window.addEventListener("resize", function() { init(true); });

    var config = { traceK: 0.4, timeDelta: 0.6 };
    var time = 0;

    var loop = function () {
        var logicalWidth = window.innerWidth;
        var logicalHeight = window.innerHeight;

        var n = -Math.cos(time);
        var pulseK = (1 + n) * 0.5;

        for (var i = 0; i < pointsOrigin.length; i++) {
            targetPoints[i] = [
                pulseK * pointsOrigin[i][0] + logicalWidth / 2,
                pulseK * pointsOrigin[i][1] + logicalHeight * 0.45 // Чуть выше центра
            ];
        }

        time += (Math.sin(time) < 0 ? 9 : n > 0.8 ? 0.2 : 1) * config.timeDelta;

        ctx.fillStyle = "rgba(0,0,0,0.1)";
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);

        for (var i = e.length; i--;) {
            var u = e[i];
            var q = targetPoints[u.q];
            var dx = u.trace[0].x - q[0];
            var dy = u.trace[0].y - q[1];
            var length = Math.sqrt(dx * dx + dy * dy);

            if (length < 10) {
                if (Math.random() > 0.95) {
                    u.q = ~~(Math.random() * heartPointsCount);
                } else {
                    if (Math.random() > 0.99) u.D *= -1;
                    u.q = (u.q + u.D) % heartPointsCount;
                    if (u.q < 0) u.q += heartPointsCount;
                }
            }

            u.vx += (-dx / length) * u.speed;
            u.vy += (-dy / length) * u.speed;
            u.trace[0].x += u.vx;
            u.trace[0].y += u.vy;
            u.vx *= u.force;
            u.vy *= u.force;

            for (var k = 0; k < u.trace.length - 1; k++) {
                var T = u.trace[k];
                var N = u.trace[k + 1];
                N.x -= config.traceK * (N.x - T.x);
                N.y -= config.traceK * (N.y - T.y);
            }

            ctx.fillStyle = u.f;
            u.trace.forEach(function(t) { ctx.fillRect(t.x, t.y, 1, 1); });
        }

        window.requestAnimationFrame(loop);
    };

    init();
    loop();
</script>
</body>
</html>
